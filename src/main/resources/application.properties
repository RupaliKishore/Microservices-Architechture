spring.application.name=Microservices-Architechture

# Database
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/architechture}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.graphql.http.path=/graphql
spring.graphql.graphiql.enabled=true
spring.graphql.graphiql.path=/graphiql
spring.graphql.schema.locations=classpath:graphql/

# Server
server.port=${PORT:8081}

# JWT
jwt.secret=${JWT_SECRET:local-dev-only-secret-key-min-32-chars-long}
jwt.expiration=${JWT_EXPIRATION:86400000}